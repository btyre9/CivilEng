schema_version = "1.0.0"

id = "civilflow"
version = "1.13.0"
name = "CivilFlow: Road, Highway & Overpass Generator"
tagline = "Roads, bridges, power lines and traffic on real terrain"
maintainer = "AI Assistant"
type = "add-on"

tags = ["Add Mesh", "Modeling"]

blender_version_min = "5.1.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Download USGS elevation and aerial photos"
files = "Import elevation and photo files from disk"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip", "._*", ".DS_Store"]
